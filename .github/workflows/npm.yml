name: npm

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # Pre-flight: confirm the npm package name is still available (or that
  # we own the namespace) before spending CI cycles on six native builds.
  # Also pulls public metadata so a publish race / accidental name squat
  # becomes a workflow-visible failure instead of a publish error.
  preflight:
    name: npm preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - name: Check package name availability
        env:
          PACKAGE_NAME: cloudpipe
        run: |
          set -euo pipefail
          # `npm view <name>` exits 0 with metadata when the name exists.
          # We want the workflow to fail loudly if the name is already
          # taken — that's a race we need to settle manually.
          if npm view "$PACKAGE_NAME" name >/dev/null 2>&1; then
            current=$(npm view "$PACKAGE_NAME" name version 2>/dev/null || true)
            echo "::error::npm package '$PACKAGE_NAME' already exists: $current"
            exit 1
          fi
          echo "ok: '$PACKAGE_NAME' is available on registry.npmjs.org"

  lint:
    name: Rust lint (cloudpipe-node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/cloudpipe-node -> target
      - name: Format check
        run: cargo fmt -p cloudpipe-node -- --check
      - name: Build workspace
        run: cargo build -p cloudpipe-node --lib
      - name: Clippy
        # `--no-deps` keeps the lint scoped to cloudpipe-node's own
        # code. The pre-existing `clippy::await_holding_lock` warnings
        # in cloudpipe-sdk/src/handle.rs are tracked separately and
        # shouldn't block the npm publish pipeline.
        run: cargo clippy -p cloudpipe-node --no-deps --all-targets -- -D warnings

  build:
    name: napi build (${{ matrix.label }})
    needs: [lint, preflight]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS arm64
            extra: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macOS x86_64
            extra: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows x86_64
            extra: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: Linux x86_64 (gnu)
            extra: ''
          # Linux aarch64-gnu + Linux x86_64-musl are deferred to v0.2.0.
          # Both need a zig cross-compiler on the runner (`cargo-zigbuild`
          # alone ships without one). Set `matrix.extra` to
          # `--cross-compile` and add a zig setup step (e.g.
          # `mlugg/setup-zig@v2`) once you want to ship them.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install napi-rs CLI
        run: npm install -g @napi-rs/cli@3
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/cloudpipe-node -> target
      - name: Build (cloudpipe-node)
        working-directory: crates/cloudpipe-node
        # Single command line (no `\` continuations): Windows runners
        # default to PowerShell, whose line-continuation grammar is
        # the backtick and would otherwise choke on a stray `\`.
        run: >
          napi build
          --platform
          --target ${{ matrix.target }}
          --release
          --strip
          ${{ matrix.extra }}
          --output-dir ./npm
          --js index.js
          --dts index.d.ts
      - name: Verify .node binary exists
        working-directory: crates/cloudpipe-node
        # Force git-bash even on Windows — the PowerShell default
        # refuses bash-isms like `! ls` in an `if` clause, and grepping
        # for a stray file pattern is more readable in bash anyway.
        shell: bash
        run: |
          ls -la npm/
          if ! ls npm/cloudpipe*.node >/dev/null 2>&1; then
            echo "::error::no cloudpipe*.node artifact produced"
            exit 1
          fi
      - name: Upload .node binary
        uses: actions/upload-artifact@v4
        with:
          name: cloudpipe-node-${{ matrix.target }}
          # Pass the directory itself (not globs). For directory
          # uploads, actions/upload-artifact@v4 strips the parent
          # prefix in the zip, so the artifact zip's top entries are
          # `npm/index.js`, `npm/index.d.ts`, `cloudpipe*.node`.
          # Pair with `merge-multiple: true` (default false) so all
          # artifacts land under `artifacts/<name>/npm/`.
          if-no-files-found: error
          path: crates/cloudpipe-node/npm

  publish:
    name: npm publish
    needs: build
    # Two trigger paths:
    #   * `v*` tag push → first-class release, picks up the tag's version
    #     for the published package.
    #   * `workflow_dispatch` → standalone npm-only release (does NOT
    #     require bumping the cfp CLI tag), so the npm package can ship
    #     out-of-band with the Rust crates. Always uses the version
    #     currently in package.json.
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - name: Download all .node binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Assemble npm package
        run: |
          set -euo pipefail
          echo "=== debug: artifacts layout ==="
          ls -la artifacts/ || true
          echo "---"
          find artifacts/ -maxdepth 4 -type f 2>/dev/null | head -40 || true
          echo "==="
          rm -rf npm-staging
          mkdir -p npm-staging/npm
          # actions/download-artifact with merge-multiple: true dumps
          # every artifact's files flat into artifacts/. Surviving
          # files from each artifact are: index.js, index.d.ts, and a
          # cloudpipe.<platform>.node binary. We pick the JS + dts from
          # any artifact (they're byte-identical across platforms) and
          # pick up every .node binary for the platform matrix.
          first_entry=$(find artifacts/ -maxdepth 2 -type f -name 'index.js' | head -1)
          if [ -z "$first_entry" ]; then
            echo "::error::no artifact index.js found — did upload-artifact pop a usable artifact?"
            exit 1
          fi
          cp "$first_entry" npm-staging/npm/index.js
          first_dts=$(find artifacts/ -maxdepth 2 -type f -name 'index.d.ts' | head -1)
          [ -n "$first_dts" ] && cp "$first_dts" npm-staging/npm/index.d.ts
          # Use our hand-written type definitions so consumers get the full
          # event-name catalog and typed callback signatures.
          cp crates/cloudpipe-node/index.d.ts npm-staging/index.d.ts
          cp crates/cloudpipe-node/package.json npm-staging/package.json
          cp crates/cloudpipe-node/README.md npm-staging/README.md
          cp crates/cloudpipe-node/LICENSE npm-staging/LICENSE
          # Copy every .node artifact into the staging area.
          # IMPORTANT: the .node binaries must live in npm-staging/npm/,
          # the same directory as index.js, because napi-rs's loader
          # uses a relative `require('./X.node')` from index.js. The
          # package.json `files` field only matches entries under npm/.
          node_count=0
          while IFS= read -r n; do
            [ -f "$n" ] || continue
            cp "$n" npm-staging/npm/
            node_count=$((node_count + 1))
          done < <(find artifacts/ -maxdepth 3 -type f -name 'cloudpipe*.node')
          if [ "$node_count" -eq 0 ]; then
            echo "::error::no cloudpipe*.node in artifacts/ — upload step dropped them?"
            exit 1
          fi
          echo "collected $node_count .node binary(ies)"
          ls -la npm-staging/
          echo "---"
          ls -la npm-staging/npm/
          echo "---"
          echo "Pack dry-run from staging dir to verify layout:"
          (cd npm-staging && npm pack --dry-run --ignore-scripts)
      - name: Publish to npm
        working-directory: npm-staging
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # --ignore-scripts because the package.json scripts reference
          # `napi`, which we don't need for publishing prebuilt artifacts.
          npm publish --provenance --ignore-scripts
          echo "published cloudpipe@${{ github.ref_name }} to npm"