name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

# Testable logic lives in `cloudpipe-node-core` because a `cargo test`
# harness for a cdylib cannot link `napi_*` symbols on some platforms. The
# binding crate itself is built and linted as a lib, and its runtime surface
# is covered by `test/smoke.js` (npm run test) and the `smoke` job in
# `npm.yml`.
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --all-targets
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Run doc tests
        run: cargo test --workspace --doc
      - name: Build SDK without CLI deps
        run: |
          cargo tree -p cloudpipe-sdk | grep -iE 'colored|clap|ctrlc|napi' \
            && (echo "SDK pulls in CLI/binding-only deps" && exit 1) \
            || echo "SDK is dependency-clean"
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  node-smoke:
    name: Node addon smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: Swatinem/rust-cache@v2
      - name: Install napi-rs CLI
        run: npm install -g @napi-rs/cli@3
      - name: Build the addon
        working-directory: crates/cloudpipe-node
        run: npm run build:debug
      - name: Check the exported surface
        working-directory: crates/cloudpipe-node
        run: npm test

  verify-checksums:
    name: cloudflared checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The digest table gates every cloudflared install. A wrong entry is
      # indistinguishable from a tampered download at the point of use, so
      # it has to be checked against the bytes GitHub actually serves —
      # not just against its own charset, which any invented hex passes.
      #
      # The job regenerates the table and diffs it against the one in the
      # tree. A missing platform and a stale digest are both hard
      # failures: the previous version only failed on a wrong digest and
      # reported missing platforms through a notice whose set arithmetic
      # could never produce a difference.
      - name: Re-derive the digest table from the pinned release
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          scripts/gen-cloudflared-checksums.sh --check

  audit:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: cargo-audit
        run: cargo install cargo-audit --locked && cargo audit
      - name: Semver check (public SDK)
        # Needs full history: `origin/main` does not exist in a
        # `fetch-depth: 1` checkout, which made this command fail for the
        # wrong reason on every PR.
        run: |
          cargo install cargo-semver-checks --locked
          cargo semver-checks check-release --baseline-rev origin/main \
            || echo "::warning::cloudpipe-sdk's public API changed"

  fmt-check-docs:
    name: Docs match the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check every documented CLI flag exists
        # The README promises a specific flag set. A typo there is
        # invisible until a user copies it into a shell.
        run: |
          set -euo pipefail
          cargo build -p cfp
          BIN=target/debug/cfp
          for flag in --verbose --no-restart --version --subdomain; do
            "$BIN" --help 2>&1 | grep -q -- "$flag" \
              || { echo "::error::README documents $flag but \`cfp --help\` lacks it"; exit 1; }
          done
          # Subcommand flags live in the subcommand's own help.
          "$BIN" key --help 2>&1 | grep -q -- "--token-file" \
            || { echo "::error::README documents --token-file but \`cfp key --help\` lacks it"; exit 1; }
          for flag in --dry-run --json; do
            "$BIN" cleanup --help 2>&1 | grep -q -- "$flag" \
              || { echo "::error::README documents \`cfp cleanup $flag\` but the subcommand lacks it"; exit 1; }
          done
          # `-v` is the log flag; `-V` is clap's version flag.
          "$BIN" -v --help 2>&1 | grep -q -- "--verbose" \
            || { echo "::error::cfp -v must map to --verbose"; exit 1; }
          # The SDK's install path pins cloudflared and verifies its digest;
          # assert the pin is present so it cannot be reverted silently.
          grep -q 'CLOUDFLARED_VERSION' crates/cloudpipe-sdk/src/session/../binary.rs \
            || { echo "::error::the pinned cloudflared version is gone"; exit 1; }
