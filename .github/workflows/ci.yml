name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

# `cloudpipe-node` is a cdylib. A `cargo test --all-targets` harness for it
# fails to link, because the `napi_*` symbols only resolve inside a Node.js
# process — so it is excluded from the test/clippy matrix and covered by
# `cloudpipe-node-core` (the napi-free crate holding the testable logic)
# plus the `test:examples` job in `npm.yml`.
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --exclude cloudpipe-node --all-targets
      - name: Run tests
        run: cargo test --workspace --exclude cloudpipe-node --all-targets
      - name: Run doc tests
        run: cargo test --workspace --exclude cloudpipe-node --doc
      - name: Build the Node addon (lib only)
        run: cargo build -p cloudpipe-node --lib
      - name: Build SDK without CLI deps
        run: |
          cargo tree -p cloudpipe-sdk | grep -iE 'colored|clap|ctrlc|napi' \
            && (echo "SDK pulls in CLI/binding-only deps" && exit 1) \
            || echo "SDK is dependency-clean"
      - name: Clippy
        run: |
          cargo clippy --workspace --exclude cloudpipe-node --all-targets -- -D warnings
          cargo clippy -p cloudpipe-node --lib -- -D warnings

  verify-checksums:
    name: cloudflared checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The digest table gates every cloudflared install. A wrong entry is
      # indistinguishable from a tampered download at the point of use, so
      # it has to be checked against the bytes GitHub actually serves —
      # not just against its own charset, which any invented hex passes.
      - name: Re-derive the digest table from the pinned release
        env:
          # Keep in sync with CLOUDFLARED_VERSION in
          # crates/cloudpipe-sdk/src/binary.rs
          VERSION: '2025.11.1'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"

          # Extract the assets + pinned digests from the source of truth.
          src="$GITHUB_WORKSPACE/crates/cloudpipe-sdk/src/binary.rs"
          assets=$(grep -oP '(?<=    \(\n)[^"]*' /dev/null || true)
          python3 - "$src" > digests.tsv <<'PY'
          import re, sys
          src = open(sys.argv[1]).read()
          body = src.split("const ASSET_SHA256", 1)[1]
          for name, digest in re.findall(r'"([\w.-]+)",\s*"([0-9a-f]{64})"', body):
              print(f"{name}\t{digest}")
          PY

          echo "pinned in-tree:"
          cat digests.tsv
          echo

          base="https://github.com/cloudflare/cloudflared/releases/download/$VERSION"
          status=0
          while IFS=$'\t' read -r asset digest; do
            [ -n "$asset" ] || continue
            actual=$(curl -fsSL --retry 3 --max-time 600 "$base/$asset" | sha256sum | cut -d' ' -f1)
            if [ "$actual" = "$digest" ]; then
              echo "  ok    $asset"
            else
              echo "  WRONG $asset"
              echo "        pinned:   $digest"
              echo "        upstream: $actual"
              status=1
            fi
          done < digests.tsv

          # Report, but do not fail, on assets this build cannot install
          # yet — those are a coverage gap the table documents.
          missing=$(python3 - "$src" <<'PY'
          import re, sys
          src = open(sys.argv[1]).read()
          names = set(re.findall(r'"(cloudflared[\w.-]+)"', src.split("const ALL_ASSETS", 1)[1]))
          pinned = set(re.findall(r'"(cloudflared[\w.-]+)"', src.split("const ASSET_SHA256", 1)[1]))
          for n in sorted(names - pinned):
              print(n)
          PY
          )
          if [ -n "$missing" ]; then
            echo
            echo "::notice::no digest pinned for: $(echo "$missing" | tr '\n' ' ')"
            echo "::notice::users on those platforms must set CFP_CLOUDFLARED_SHA256 or install cloudflared manually"
          fi

          exit $status

  audit:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: cargo-audit
        run: cargo install cargo-audit --locked && cargo audit
      - name: Semver check (public SDK)
        # Needs full history: `origin/main` does not exist in a
        # `fetch-depth: 1` checkout, which made this command fail for the
        # wrong reason on every PR.
        run: |
          cargo install cargo-semver-checks --locked
          cargo semver-checks check-release --baseline-rev origin/main \
            || echo "::warning::cloudpipe-sdk's public API changed"

  fmt-check-docs:
    name: Docs match the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check every documented CLI flag exists
        # The README promises a specific flag set. A typo there is
        # invisible until a user copies it into a shell.
        run: |
          set -euo pipefail
          cargo build -p cfp
          BIN=target/debug/cfp
          for flag in --verbose --no-restart --version --subdomain; do
            "$BIN" --help 2>&1 | grep -q -- "$flag" \
              || { echo "::error::README documents $flag but \`cfp --help\` lacks it"; exit 1; }
          done
          for flag in --dry-run --json; do
            "$BIN" cleanup --help 2>&1 | grep -q -- "$flag" \
              || { echo "::error::README documents \`cfp cleanup $flag\` but the subcommand lacks it"; exit 1; }
          done
          # `-v` is the log flag; `-V` is clap's version flag.
          "$BIN" -v --help 2>&1 | grep -q -- "--verbose" \
            || { echo "::error::cfp -v must map to --verbose"; exit 1; }
          # The SDK's install path pins cloudflared and verifies its digest;
          # assert the pin is present so it cannot be reverted silently.
          grep -q 'CLOUDFLARED_VERSION' crates/cloudpipe-sdk/src/session/../binary.rs \
            || { echo "::error::the pinned cloudflared version is gone"; exit 1; }
