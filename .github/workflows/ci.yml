name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/cloudpipe-sdk crates/cloudpipe -> target
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build workspace
        run: cargo build --workspace --all-targets
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Build SDK without CLI deps
        run: |
          cargo tree -p cloudpipe-sdk | grep -iE 'colored|clap|ctrlc' \
            && (echo "SDK pulls in CLI-only deps" && exit 1) \
            || echo "SDK is dependency-clean"
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings