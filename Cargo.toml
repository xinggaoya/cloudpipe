[workspace]
resolver = "2"
members = [
    "crates/cloudpipe",
    "crates/cloudpipe-sdk",
    "crates/cloudpipe-node-core",
    "crates/cloudpipe-node",
    "crates/cloudpipe-test-support",
]

[workspace.package]
edition = "2021"
# `std::sync::LazyLock` (crates/cloudpipe/src/ui.rs, crates/cloudpipe-node)
# is stable since 1.80. The README previously advertised 1.70, which was
# already wrong; keeping the field and the README in sync makes the floor
# enforced by cargo rather than merely documented.
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/xinggaoya/cloudpipe"
homepage = "https://github.com/xinggaoya/cloudpipe"

[workspace.lints.rust]
missing_docs = "warn"
# The only `unsafe` in the tree is a `kill(2)` call in the supervisor, which
# documents its invariants. New unsafe has to be an explicit, reviewed
# decision rather than something that slips into a review unnoticed.
unsafe_code = "deny"

[workspace.lints.clippy]
# Guards a class of bug this codebase has already hit twice: holding a lock
# guard across an `.await`. Rust's std `Mutex` in particular must never be
# held that way — see `handle::take_pump`.
await_holding_lock = "deny"

[workspace.dependencies]
anyhow = "1"
cloudpipe-sdk = { path = "crates/cloudpipe-sdk", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
colored = "3"
dirs = "6"
flate2 = "1"
futures = "0.3"
# OS credential store (Windows Credential Manager / macOS Keychain / Linux
# Secret Service). Used by the CLI only — the SDK stays UI-agnostic and
# takes the token as a plain string.
keyring = "4"
# NOTE: no `blocking` feature — nothing in the workspace uses the blocking
# client, and enabling it pulls in an extra runtime path for no benefit.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "fs", "time", "signal"] }
tracing = "0.1"

# Node addon bindings. Kept here so the version is decided once for the
# workspace rather than drifting between the binding and its helpers.
napi = { version = "3", default-features = false, features = ["napi4", "serde-json", "async", "tokio_rt"] }
napi-derive = "3"
napi-build = "2"

[profile.release]
strip = true
lto = true
opt-level = 3