[package]
name = "cfp"
version = "0.1.0"
edition = "2021"
description = "Serverless localhost tunnels via Cloudflare Edge — single static binary, bring your own Cloudflare API token, no backend service"
license = "MIT"
repository = "https://github.com/xinggaoya/cloudpipe"
homepage = "https://github.com/xinggaoya/cloudpipe"
readme = "README.md"
keywords = ["cloudflare", "tunnel", "localhost", "cloudflared", "ngrok-alternative"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "3"
ctrlc = "3"
dirs = "6"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"

[profile.release]
strip = true
lto = true
opt-level = 3