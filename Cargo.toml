[workspace]
resolver = "2"
members = [
    "crates/cloudpipe",
    "crates/cloudpipe-sdk",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/xinggaoya/cloudpipe"
homepage = "https://github.com/xinggaoya/cloudpipe"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "3"
ctrlc = "3"
dirs = "6"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "fs", "time", "signal"] }
tracing = "0.1"

[profile.release]
strip = true
lto = true
opt-level = 3