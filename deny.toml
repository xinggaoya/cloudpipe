# cargo-deny configuration.
#
# The SDK is `MIT`; everything it links must be permissively licensed so
# the CLI can keep shipping as a single static binary under those terms.

[graph]
# The Node addon lives outside the default workspace feature set but still
# shares the lockfile, so resolve everything.
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # windows-sys / windows-targets ship the Windows SDK licence.
    "MIT OR Apache-2.0",
]
confidence-threshold = 0.9
# `unlicensed` is an error: a dependency with no declared licence cannot be
# reasoned about at all.
unused-allowed-license = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
