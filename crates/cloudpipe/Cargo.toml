[package]
name = "cfp"
version = "0.1.0"
edition.workspace = true
description = "cfp — serverless localhost tunnels via Cloudflare Edge (single static binary)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["cloudflare", "tunnel", "localhost", "cloudflared", "ngrok-alternative"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "cfp"
path = "src/main.rs"

[dependencies]
cloudpipe-sdk = { path = "../cloudpipe-sdk" }

anyhow = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true