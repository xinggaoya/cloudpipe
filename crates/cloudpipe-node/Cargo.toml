[package]
name = "cloudpipe-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Node.js bindings for cloudpipe — serverless Cloudflare tunnels via napi-rs"
keywords = ["cloudflare", "tunnel", "napi", "nodejs", "ngrok-alternative"]
categories = ["api-bindings", "network-programming"]
links = "cloudpipe"

[lib]
name = "cloudpipe_node"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
cloudpipe-sdk = { path = "../cloudpipe-sdk" }
napi = { version = "3", default-features = false, features = ["napi4", "serde-json", "async", "tokio_rt"] }
napi-derive = "3"
once_cell = "1"
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "rt"] }

[build-dependencies]
napi-build = "2"