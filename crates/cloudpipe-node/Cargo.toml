[package]
name = "cloudpipe-node"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Node.js bindings for cloudpipe — serverless Cloudflare tunnels via napi-rs"
keywords = ["cloudflare", "tunnel", "napi", "nodejs", "ngrok-alternative"]
categories = ["api-bindings", "network-programming"]
links = "cloudpipe"
# NOTE: `cdylib` only — this crate is a Node addon, not something a Rust
# consumer links against. All testable logic lives in `cloudpipe-node-core`
# precisely because a cdylib's test harness cannot link napi symbols.

[lib]
name = "cloudpipe_node"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
cloudpipe-sdk = { workspace = true }
cloudpipe-node-core = { path = "../cloudpipe-node-core", version = "0.1.1" }
napi = { workspace = true }
napi-derive = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[build-dependencies]
napi-build = { workspace = true }

[lints]
workspace = true
