[package]
name = "cloudpipe-sdk"
version = "0.1.0"
edition.workspace = true
description = "Async Rust SDK for serverless Cloudflare tunnels (no backend service)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["cloudflare", "tunnel", "localhost", "cloudflared", "ngrok-alternative", "sdk"]
categories = ["api-bindings", "network-programming", "asynchronous"]

[lib]
name = "cloudpipe_sdk"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
dirs = { workspace = true }
flate2 = { workspace = true }
futures = "0.3"
getrandom = "0.3"
reqwest = { workspace = true }
serde = { workspace = true }
sha2 = "0.10"
serde_json = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `tempfile` gives each test its own self-cleaning directory. The previous
# `std::env::temp_dir().join(format!("cfp-test-{}", process::id()))` scheme
# made cases in the same test binary collide.
tempfile = "3"
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true